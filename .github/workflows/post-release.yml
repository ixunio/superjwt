name: Upload Python Package

on:
  release:
    types: [published]

run-name: Publish ${{ github.event.release.tag_name }} PyPI Package and Documentation

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish-on-testpypi:
    runs-on: ubuntu-latest
    needs: [build-package]
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/superjwt/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-on-pypi:
    runs-on: ubuntu-latest
    needs: [publish-on-testpypi]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/superjwt/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

  deploy-docs:
    name: Deploy Versioned Documentation
    runs-on: ubuntu-latest
    needs: [publish-on-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Configure git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Set cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      
      - name: Cache documentation dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      
      - name: Install documentation dependencies
        run: pip install --group docs
      
      - name: Extract 'major.minor' version
        id: version
        run: |
          MAJOR_MINOR=$(echo "${{ github.event.release.tag_name }}" | grep -oP '^(?:v)?\K\d+\.\d+')
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "📦 Deploying docs for version: $MAJOR_MINOR"
      
      - name: Deploy 'major.minor' documentation
        run: mike deploy ${{ steps.version.outputs.major_minor }} latest --push --update-aliases

